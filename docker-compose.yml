services:

  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile

    depends_on:
      litellm-db:
        condition: service_healthy

    container_name: litellm
    restart: unless-stopped

    ports:
      - "127.0.0.1:4001:4000"

    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@litellm-db:5432/${POSTGRES_DB}
      KAIDESHARK_OLLAMA_URL: ${KAIDESHARK_OLLAMA_URL}
      KHARESSAADARA_OLLAMA_URL: ${KHARESSAADARA_OLLAMA_URL}
      GALACTUS_OLLAMA_URL: ${GALACTUS_OLLAMA_URL}

    command:
      - "--config"
      - "/app/config.yaml"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - ai-gateway

  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /mnt/38tb/containers/data/ai-gateway/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai-gateway

  scheduler:
    build:
      context: ./scheduler

    container_name: ai-scheduler
    restart: unless-stopped

    depends_on:
      - litellm

    ports:
      - "4000:4000"

    environment:
      LITELLM_URL: http://litellm:4000

      KAIDESHARK_AGENT_URL: ${KAIDESHARK_AGENT_URL}
      KHARESSAADARA_AGENT_URL: ${KHARESSAADARA_AGENT_URL}

      GALACTUS_OLLAMA_URL: ${GALACTUS_OLLAMA_URL}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - ai-gateway


networks:
  ai-gateway:
    driver: bridge
